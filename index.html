<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Date Header</title>

  <!-- Sanchez Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sanchez&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: transparent;
      font-family: 'Sanchez', serif;
    }

    .container {
      position: relative;
      height: 90px;
      padding: 14px 16px;
      box-sizing: border-box;
    }

    .date {
      font-size: 22px;
      color: #f8ee21;
    }

    .logo-wrap {
      position: absolute;
      top: 0;
      right: 0;
      background: #000;
      padding: 10px;
    }

    .logo-wrap img {
      height: 60px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="date" id="currentDate"></div>

    <div class="logo-wrap">
      <img src="AmericasPlace.png" alt="Waffle House America's Place">
    </div>
  </div>

  <script>
    (function () {
      var d = new Date();
      var options = {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      };
      document.getElementById('currentDate').textContent =
        d.toLocaleDateString('en-US', options);
    })();
  </script>

</body>
</html>
