<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Date Badge</title>

  <!-- Sanchez font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sanchez&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: transparent;
      font-family: 'Sanchez', serif;
    }

    .badge-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 140px;
      width: 100%;
    }

    .date-badge {
      background: #000000;
      color: #f8ee21;
      border: 6px solid #f8ee21;
      border-radius: 28px;
      padding: 28px 48px;
      font-size: 40px;
      font-weight: 400;
      letter-spacing: 1px;
      text-align: center;
      box-sizing: border-box;
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      .date-badge {
        font-size: 26px;
        padding: 20px 28px;
      }
    }
  </style>
</head>
<body>

  <div class="badge-wrapper">
    <div class="date-badge" id="dateDisplay">
      <!-- Date injected here -->
    </div>
  </div>
</body>
</html>
